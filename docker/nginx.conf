# This file is included inside Nginx's http {} block.
# Dokploy/Traefik terminates public HTTPS and forwards X-Forwarded-Proto.
map $http_x_forwarded_proto $fcgi_https {
    default "";
    https   on;
}

server {
    listen 80;
    server_name _;

    # Moodle 5.1+ must expose only its public/ directory.
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 132m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Moodle's router handles routes that aren't real files.
    location / {
        try_files $uri $uri/ /r.php$is_args$args;
    }

    # Execute existing PHP scripts only. Never pass a missing script to PHP-FPM.
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $fcgi_https if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass moodle:9000;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    # Deny hidden files. Public webroot is already separated from config and code.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:bak|conf|dist|ini|log|sh|sql|swp|tmp)$ {
        deny all;
    }
}
