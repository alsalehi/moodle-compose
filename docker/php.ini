; Moodle production PHP settings
expose_php = Off
allow_url_include = Off
cgi.fix_pathinfo = 0

; Never display stack traces or PHP internals to public visitors.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Moodle 5.2 requires max_input_vars >= 5000.
max_input_vars = 5000
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
file_uploads = On
upload_max_filesize = 128M
post_max_size = 132M
max_file_uploads = 50
date.timezone = UTC

; HTTPS is terminated by Dokploy's reverse proxy.
session.cookie_secure = 1
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax

; The Moodle code is baked into versioned images; restart/redeploy to load updates.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
