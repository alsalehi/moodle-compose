[www]
user = www-data
group = www-data
listen = 9000
listen.backlog = 511

; Conservative starting pool. Tune to available RAM and expected concurrency.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Keep the FPM worker environment clean; Moodle config is stored in config.php.
clear_env = yes
security.limit_extensions = .php
catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 300s
